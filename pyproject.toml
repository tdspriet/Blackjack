[project]
name = "onebj"
version = "0.1.0"
description = "ONE Blackjack Lab: simulator, counting analytics and neural-network agent for Pragmatic Play's ONE Blackjack"
readme = "docs/SPEC.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/onebj"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
